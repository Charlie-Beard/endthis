<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset Generator — EndThis</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    p { font-size: 0.875rem; color: #666; margin-bottom: 2rem; }
    .asset { background: white; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; display: inline-flex; flex-direction: column; gap: 1rem; vertical-align: top; margin-right: 1rem; }
    canvas { display: block; border: 1px solid #e5e5e5; border-radius: 8px; }
    button {
      padding: 0.625rem 1.25rem; background: #D97757; color: white; border: none;
      border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #C96848; }
    label { font-size: 0.8125rem; font-weight: 600; color: #444; }
  </style>
</head>
<body>
  <h1>EndThis — Asset Generator</h1>
  <p>Open this file in a browser, then click the download buttons to save the PNG assets into this folder.</p>

  <div class="asset">
    <label>favicon-32.png (32×32)</label>
    <canvas id="fav32" width="32" height="32"></canvas>
    <button onclick="download('fav32', 'favicon-32.png')">Download favicon-32.png</button>
  </div>

  <div class="asset">
    <label>apple-touch-icon.png (180×180)</label>
    <canvas id="fav180" width="180" height="180" style="width:90px;height:90px"></canvas>
    <button onclick="download('fav180', 'apple-touch-icon.png')">Download apple-touch-icon.png</button>
  </div>

  <div class="asset" style="display:flex;flex-direction:column">
    <label>og-image.png (1200×630)</label>
    <canvas id="og" width="1200" height="630" style="width:600px;height:315px"></canvas>
    <button onclick="download('og', 'og-image.png')">Download og-image.png</button>
  </div>

<script>
const CORAL  = '#D97757';
const DARK   = '#1A1814';
const CREAM  = '#FAF9F7';
const MUTED  = '#7B7267';
const BORDER = 'rgba(255,255,255,0.1)';

// ── Rounded rectangle helper ──────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Favicon ───────────────────────────────────────────────────────────────────
function drawFavicon(id) {
  const canvas = document.getElementById(id);
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  const r = s * 0.234; // ~7.5/32

  // Background
  roundRect(ctx, 0, 0, s, s, r);
  ctx.fillStyle = CORAL;
  ctx.fill();

  // Checkmark
  const sw = s * 0.086;
  ctx.strokeStyle = 'white';
  ctx.lineWidth = sw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(s * 0.266, s * 0.516);
  ctx.lineTo(s * 0.422, s * 0.672);  // down to trough
  ctx.lineTo(s * 0.734, s * 0.328);  // up to top-right
  ctx.stroke();
}

drawFavicon('fav32');
drawFavicon('fav180');

// ── OG image ──────────────────────────────────────────────────────────────────
function drawOG() {
  const canvas = document.getElementById('og');
  const W = 1200, H = 630;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = DARK;
  ctx.fillRect(0, 0, W, H);

  // Subtle warm gradient overlay
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, 'rgba(217,119,87,0.06)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Left content ─────────────────────────────────────────────────────
  const lx = 96;

  // Coral accent pill
  roundRect(ctx, lx, 100, 48, 6, 3);
  ctx.fillStyle = CORAL;
  ctx.fill();

  // Wordmark
  ctx.fillStyle = CREAM;
  ctx.font = '700 96px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.letterSpacing = '-3px';
  ctx.fillText('EndThis', lx, 252);
  ctx.letterSpacing = '0px';

  // Tagline line 1
  ctx.fillStyle = 'rgba(250,249,247,0.65)';
  ctx.font = '400 34px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('Give your team a voice,', lx, 320);

  // Tagline line 2
  ctx.fillText('without raising theirs.', lx, 366);

  // Domain
  ctx.fillStyle = 'rgba(123,114,103,0.8)';
  ctx.font = '400 24px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('endthis.online', lx, 554);

  // Right: mock vote counter card ────────────────────────────────────
  const cx = 740, cy = 130, cw = 370, ch = 300, cr = 16;

  // Card background
  roundRect(ctx, cx, cy, cw, ch, cr);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fill();
  roundRect(ctx, cx, cy, cw, ch, cr);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Vote numbers: "3 of 8"
  const numX = cx + cw / 2;
  ctx.textAlign = 'center';

  ctx.fillStyle = CREAM;
  ctx.font = '700 80px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.letterSpacing = '-3px';
  ctx.fillText('3', numX - 68, cy + 110);
  ctx.letterSpacing = '0px';

  ctx.fillStyle = MUTED;
  ctx.font = '500 44px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('of 8', numX + 40, cy + 110);

  // Descriptor
  ctx.fillStyle = 'rgba(123,114,103,0.9)';
  ctx.font = '400 20px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('want to end this meeting', numX, cy + 156);

  // Progress bar track
  const bx = cx + 28, by = cy + 188, bw = cw - 56, bh = 5;
  roundRect(ctx, bx, by, bw, bh, 2.5);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();

  // Progress bar fill (37.5% → 3/8)
  roundRect(ctx, bx, by, bw * 0.375, bh, 2.5);
  ctx.fillStyle = CORAL;
  ctx.fill();

  // "Anonymous" label at bottom of card
  ctx.fillStyle = 'rgba(123,114,103,0.6)';
  ctx.font = '400 16px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('100% anonymous', numX, cy + ch - 24);

  ctx.textAlign = 'left';
}

drawOG();

// ── Download ──────────────────────────────────────────────────────────────────
function download(canvasId, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = document.getElementById(canvasId).toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
